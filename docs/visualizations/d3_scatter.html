<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>D3 Scatter Plot - Victim Age vs Time of Day</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { font-family: sans-serif; }
    #chart { margin: 20px; }

    circle:hover {
      stroke: black;
      stroke-width: 1px;
    }

    .tooltip {
      position: absolute;
      padding: 6px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 4px;
      pointer-events: none;
      visibility: hidden;
      font-size: 12px;
    }

    #controls {
      margin: 20px;
      font-size: 16px;
    }

    .slider-container {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>D3 Scatter Plot: Victim Age vs Time of Day</h2>

<!-- Filters -->
<div id="controls">
  <label><strong>Select Crime Type:</strong></label>
  <select id="crimeSelect"></select>

  <div class="slider-container">
    <label><strong>Time Range:</strong></label>
    <br>
    Start: <input type="range" id="startTime" min="0" max="24" value="0" step="1">
    End: <input type="range" id="endTime" min="0" max="24" value="24" step="1">
    <p id="timeLabel">Showing crimes from 0:00 to 24:00</p>
  </div>
</div>

<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script>

  const width = 800;
  const height = 500;
  const margin = {top: 40, right: 40, bottom: 60, left: 80};

  const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

  const tooltip = d3.select("#tooltip");

  // Convert TIME OCC into decimal hour (e.g., "1345" -> 13.75)
  function convertToHour(t) {
    t = t.toString().padStart(4, "0");
    const h = +t.slice(0, 2);
    const m = +t.slice(2);
    return h + m / 60;
  }

  // Initial axes groups (created ONCE)
  const xAxisGroup = svg.append("g")
      .attr("transform", `translate(0, ${height - margin.bottom})`);

  const yAxisGroup = svg.append("g")
      .attr("transform", `translate(${margin.left}, 0)`);

  // Load data
  d3.csv("../data/crm_for_d3.csv").then(raw => {

      // Prepare & clean data
      let data = raw.map(d => ({
        age: +d["Vict Age"],
        time: convertToHour(d["TIME OCC"]),
        crimeDesc: d["Crm Cd Desc"],
        date: d["DATE OCC"],
        weapon: d["Weapon Desc"]
      })).filter(d => d.age > 0);

      // Dropdown
      const crimeTypes = Array.from(new Set(data.map(d => d.crimeDesc))).sort();
      const select = d3.select("#crimeSelect");
      select.selectAll("option")
          .data(["All Crimes", ...crimeTypes])
          .enter()
          .append("option")
          .text(d => d);

      // Sliders
      const startSlider = d3.select("#startTime");
      const endSlider = d3.select("#endTime");
      const timeLabel = d3.select("#timeLabel");

      // X scale stays constant
      const x = d3.scaleLinear()
          .domain(d3.extent(data, d => d.age)).nice()
          .range([margin.left, width - margin.right]);

      // Draw x-axis once (static)
      xAxisGroup.call(d3.axisBottom(x));

      // X-axis label
      svg.append("text")
        .attr("x", width / 2)
        .attr("y", height - 15)
        .attr("text-anchor", "middle")
        .text("Victim Age");

      // Y-axis label
      svg.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .text("Time of Day (24-hour)");

      const color = d3.scaleOrdinal(d3.schemeTableau10);

      // Main update function
      function updateScatter() {

          const crimeFilter = select.node().value;
          const start = +startSlider.node().value;
          const end = +endSlider.node().value;

          timeLabel.text(`Showing crimes from ${start}:00 to ${end}:00`);

          let filtered = data.filter(d =>
              d.time >= start &&
              d.time <= end &&
              (crimeFilter === "All Crimes" || d.crimeDesc === crimeFilter)
          );

          // Limit number of points for readability
          if (filtered.length > 5000) {
            filtered = filtered.slice(0, 5000);
          }

          // UPDATED Y SCALE that changes with slider
          const y = d3.scaleLinear()
              .domain([start, end])
              .range([height - margin.bottom, margin.top]);

          // Redraw Y-axis CLEANLY
          yAxisGroup.call(
            d3.axisLeft(y)
              .ticks(6)
              .tickFormat(d => d + ":00")
          );

          // Bind data to circles
          const circles = svg.selectAll("circle")
              .data(filtered, d => `${d.age}-${d.time}-${d.crimeDesc}`);

          // ENTER
          circles.enter()
              .append("circle")
              .attr("cx", d => x(d.age))
              .attr("cy", d => y(d.time))
              .attr("r", 3)
              .attr("fill", d => color(d.crimeDesc))
              .attr("opacity", 0.7)
              .on("mouseover", (event, d) => {
                tooltip.style("visibility", "visible")
                       .html(`
                        <strong>${d.crimeDesc}</strong><br>
                        Victim Age: ${d.age}<br>
                        Time: ${d.time.toFixed(2)}<br>
                        Date: ${d.date}<br>
                        Weapon: ${d.weapon || "N/A"}
                       `);
              })
              .on("mousemove", event => {
                tooltip.style("top", (event.pageY + 10) + "px")
                       .style("left", (event.pageX + 10) + "px");
              })
              .on("mouseout", () => tooltip.style("visibility", "hidden"));

          // UPDATE
          circles
            .attr("cx", d => x(d.age))
            .attr("cy", d => y(d.time));

          // EXIT
          circles.exit().remove();
      }

      // Initial render
      updateScatter();

      // Attach event listeners
      select.on("change", updateScatter);
      startSlider.on("input", updateScatter);
      endSlider.on("input", updateScatter);
  });

</script>

</body>
</html>
